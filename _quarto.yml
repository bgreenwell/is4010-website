project:
  type: website
  # Render only page sources. This keeps repository documentation that happens to
  # live at the project root (AGENTS.md, CLAUDE.md, TODO.md, README.md) out of the
  # published site and out of the search index.
  render:
    - "**/*.qmd"
    - "**/*.ipynb"

website:
  title: "IS 4010: App Dev with AI"
  description: "Course materials for IS 4010: Application Development with Artificial Intelligence at the University of Cincinnati."
  favicon: images/uc-logo-2.png
  page-navigation: true
  page-footer: "IS 4010: App Dev with AI"

  sidebar:
    style: docked
    pinned: true
    search: true
    collapse-level: 1
    tools:
      - icon: github
        href: https://github.com/bgreenwell/is4010-labs
        text: "Labs"
      - icon: journal-text
        href: https://uc.instructure.com/
        text: "Canvas"
    contents:
      - text: "Home"
        href: index.qmd
      - text: "Syllabus (Simple Syllabus)"
        href: https://uc.simplesyllabus.com/doc/mkhmypnvx/2026-Fall-IS-4010-%2822%29-001-%2810885%29-Application-Development-with-Artificial-Intelligence
      - text: "Final project"
        href: project.qmd
      - section: "Resources"
