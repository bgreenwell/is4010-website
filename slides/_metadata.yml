# Shared configuration for every lecture deck.
#
# This is directory metadata, not a nested project, so it applies when the decks are
# rendered as part of the parent website project. Keep per-deck front matter limited to
# title, subtitle, and author so that all decks stay visually identical.
format:
  revealjs:
    self-contained: false
    theme: dracula
    transition: fade
    slide-number: true
    chalkboard: true
    preview-links: auto
    scrollable: true
    css: custom.css
    footer: "IS4010: app development with AI"

execute:
  # Code blocks are displayed, never executed. Many slide examples are illustrative
  # fragments that cannot run standalone, and disabling execution here keeps both the
  # revealjs and ipynb renders free of a Jupyter dependency.
  enabled: false
  echo: true
  warning: false
  error: false
