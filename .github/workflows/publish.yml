on:
  push:
    branches: main
  schedule:
    - cron: '0 0 * * 1'  # Run every Monday at midnight UTC

name: Render and Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          # Pinned so notebook generation is byte-identical here and on a maintainer's
          # machine. Quarto versions differ in markdown list indentation, which otherwise
          # rewrites every notebook and produces a bot commit on each push.
          version: 1.8.25

      # The Python decks are the single source for the companion notebooks. Regenerate
      # before rendering so the site picks the new notebooks up in this same run.
      - name: Generate companion notebooks
        run: python3 scripts/build-notebooks.py

      - name: Commit regenerated notebooks
        if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          if [ -n "$(git status --porcelain weeks/*-notebook.ipynb)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add weeks/*-notebook.ipynb
            git commit -m "chore: regenerate companion notebooks from the decks [skip ci]"
            git push
          else
            echo "notebooks already up to date"
          fi

      # Renders the whole project, slides included. Deck configuration lives in
      # slides/_metadata.yml, so this produces byte-identical output to a local
      # `quarto render`. Do not add a second slides-only render.
      - name: Render website and slides
        run: |
          quarto render . --output-dir _site

      - name: Link Checker
        uses: lycheeverse/lychee-action@22134d37a1fff6c2974df9c92a7c7e1e86a08f9c # v1.9.0
        with:
          args: --verbose --no-progress "_site/**/*.html"
          fail: false  # Report but don't fail the build for broken links

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
